    <h1>PUMA</h1>
    <hr>
    <p><b>Puma (Puma concolor)</b> adalah sejenis kucing liar besar (Felinae) yang berasal dari Benua Amerika. Hewan ini dikenal juga dengan nama singa gunung, cougar, atau panther. Meskipun bertubuh besar, puma masuk dalam kelompok kucing kecil karena tidak bisa mengaum seperti singa atau harimau.</p>
